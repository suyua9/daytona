  <rect x="684" y="78" width="172" height="34" rx="17" fill="#0a0a0a" />
  <circle cx="706" cy="95" r="6" fill="#2ecc71" />
  <text x="722" y="101" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="16">Daytona throughput</text>

  <rect x="690" y="118" width="154" height="34" rx="17" fill="#f3f4f6" stroke="#d4d4d4" />
  <text x="767" y="141" fill="#0a0a0a" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle">98.43 calls/s at 128</text>

  <text x="64" y="526" fill="#6b7280" font-family="Inter, Arial, sans-serif" font-size="14">

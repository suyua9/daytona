<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Daytona throughput on the veRL ReTool benchmark</title>
  <desc id="desc">A line chart showing cpu_bound_stdout throughput rising from 1.51 calls per second at concurrency 1 to 98.43 calls per second at concurrency 128.</desc>

  <rect width="920" height="540" rx="28" fill="#ffffff" />
  <rect x="24" y="24" width="872" height="492" rx="20" fill="#ffffff" stroke="#e5e5e5" />

  <text x="64" y="68" fill="#0a0a0a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">
    Daytona throughput on veRL ReTool
  </text>
  <text x="64" y="98" fill="#4b5563" font-family="Inter, Arial, sans-serif" font-size="18">
    cpu_bound_stdout from benchmark_tool_backends.py. Higher is better.
  </text>

  <line x1="92" y1="132" x2="848" y2="132" stroke="#d4d4d4" stroke-width="1" />
  <line x1="92" y1="210" x2="848" y2="210" stroke="#d4d4d4" stroke-width="1" />
  <line x1="92" y1="288" x2="848" y2="288" stroke="#d4d4d4" stroke-width="1" />
  <line x1="92" y1="366" x2="848" y2="366" stroke="#d4d4d4" stroke-width="1" />
  <line x1="92" y1="444" x2="848" y2="444" stroke="#0a0a0a" stroke-width="1.5" />

  <line x1="92" y1="132" x2="92" y2="444" stroke="#0a0a0a" stroke-width="1.5" />
  <line x1="92" y1="444" x2="848" y2="444" stroke="#0a0a0a" stroke-width="1.5" />

  <text x="76" y="450" fill="#0a0a0a" font-family="Berkeley Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="end">0</text>
  <text x="76" y="372" fill="#0a0a0a" font-family="Berkeley Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="end">25</text>
  <text x="76" y="294" fill="#0a0a0a" font-family="Berkeley Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="end">50</text>
  <text x="76" y="216" fill="#0a0a0a" font-family="Berkeley Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="end">75</text>
  <text x="76" y="138" fill="#0a0a0a" font-family="Berkeley Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="end">100</text>

  <text x="64" y="118" fill="#0a0a0a" font-family="Berkeley Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Throughput (calls/s)</text>
